name: build-cu121-wheels

# Build mmcv CUDA-ops wheels specialized per compute capability against
# torch + cu121, then publish them to the GitHub Release.
#
# Trigger:
#   - push a tag matching cu121-wheels-*   -> builds + uploads to that release
#   - manual (workflow_dispatch)           -> builds + uploads artifacts only
#
# Compilation needs nvcc (CUDA 12.1 devel container) but NOT a GPU — building
# CUDA extensions is a compile step, so GitHub-hosted CPU runners suffice.

on:
  push:
    tags:
      - 'cu121-wheels-*'
  workflow_dispatch:
    inputs:
      torch_version:
        description: 'torch version to build against (cu121)'
        default: '2.1.0'
        type: string
      python_version:
        description: 'CPython version (cp tag)'
        default: '3.10'
        type: string

permissions:
  contents: write   # required to upload assets to the Release

env:
  TORCH_VERSION: ${{ github.event.inputs.torch_version || '2.1.0' }}
  PYTHON_VERSION: ${{ github.event.inputs.python_version || '3.10' }}
  CU_INDEX: https://download.pytorch.org/whl/cu121

jobs:
  build:
    name: build sm_${{ matrix.cc }}
    runs-on: ubuntu-latest
    container:
      # Build on ubuntu 20.04 (glibc 2.31) to match the RunPod/deploy target. Building on
      # 22.04 (glibc 2.35) produced wheels that fail there with "GLIBC_2.32 not found".
      image: nvidia/cuda:12.1.1-devel-ubuntu20.04
    strategy:
      fail-fast: false
      matrix:
        # sm_90 max; 10.0 / 12.0 (Blackwell) deferred — cu121 nvcc can't target them.
        cc: ['6.1', '6.2', '8.6', '8.7', '8.9', '9.0']
    steps:
      - name: Install build toolchain (uv + Python)
        run: |
          set -eux
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends curl ca-certificates git ninja-build xz-utils
          # ubuntu 20.04 ships python3.8; get a portable Python via uv (deadsnakes is
          # unreliable in this image). The compiled .so still links the container's glibc 2.31.
          curl -LsSf https://astral.sh/uv/install.sh | env UV_INSTALL_DIR=/usr/local/bin sh
          uv venv --python "${PYTHON_VERSION}" /opt/be
          # setuptools<81: torch's cpp_extension imports pkg_resources (gone in setuptools>=81),
          # otherwise `import torch` fails in setup.py and ops are silently skipped.
          uv pip install --python /opt/be/bin/python pip "setuptools<81" wheel ninja packaging "numpy<2"

      - name: Checkout (with submodules)
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install torch (cu121)
        run: |
          set -eux
          uv pip install --python /opt/be/bin/python "torch==${TORCH_VERSION}" \
            --index-strategy unsafe-best-match --extra-index-url "${CU_INDEX}"

      - name: Build mmcv wheel for compute capability ${{ matrix.cc }}
        run: |
          set -eux
          # The repo root carries a uv *devenv* pyproject.toml (for `just sync`);
          # move it aside so `pip wheel .` builds mmcv from setup.py, not the devenv.
          if [ -f pyproject.toml ]; then mv pyproject.toml /tmp/devenv-pyproject.toml; fi
          export MMCV_WITH_OPS=1
          export FORCE_CUDA=1
          export TORCH_CUDA_ARCH_LIST="${{ matrix.cc }}"
          export MAX_JOBS=4
          rm -rf dist
          /opt/be/bin/python -m pip wheel --no-build-isolation --no-deps -w dist . -v
          if [ -f /tmp/devenv-pyproject.toml ]; then mv /tmp/devenv-pyproject.toml pyproject.toml; fi
          # Guard: a pure-Python (*none-any*) wheel means the CUDA ext failed to compile
          # (e.g. torch not importable at build). The whole point is the compiled ops.
          # POSIX-sh safe (no bash-only parameter expansion).
          if ls dist/*none-any*.whl >/dev/null 2>&1; then
            echo "ERROR: built a no-ops wheel (CUDA ext not compiled). Contents:"; ls -l dist; exit 1
          fi

      - name: Tag wheel filename with the compute capability
        id: tag
        run: |
          set -eux
          SM="$(echo '${{ matrix.cc }}' | tr -d '.')"   # 8.6 -> 86
          PT="$(echo "${TORCH_VERSION}" | tr -d '.')"    # 2.1.0 -> 210
          # torch-ABI-specific: encode both compute capability and torch version so a
          # torch2.1 wheel can't be confused with a torch2.4 one. e.g. 0sm86t210.
          BUILD_TAG="0sm${SM}t${PT}"                      # valid wheel build tag (starts with a digit)
          mkdir -p out
          for w in dist/*.whl; do
            base="$(basename "$w")"
            # insert the build tag between {version} and {python tag}: mmcv-<ver>-<build>-cp310-...
            new="$(echo "$base" | sed -E "s/^(mmcv-[^-]+)-(cp[0-9]+)/\1-${BUILD_TAG}-\2/")"
            cp "$w" "out/${new}"
            echo "renamed ${base} -> ${new}"
          done
          ls -lh out
          echo "sm=${SM}" >> "$GITHUB_OUTPUT"

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v5
        with:
          name: mmcv-cu121-sm${{ steps.tag.outputs.sm }}
          path: out/*.whl
          if-no-files-found: error

  release:
    name: publish wheels to Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download all wheel artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts
          merge-multiple: true

      - name: List collected wheels
        run: ls -lhR artifacts

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.whl
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            mmcv CUDA-ops wheels built against torch ${{ env.TORCH_VERSION }} + cu121,
            specialized per compute capability (sm_61, sm_62, sm_86, sm_87, sm_89, sm_90).

            Each wheel carries a `0sm<NN>` build tag, e.g. `mmcv-<ver>-0sm86-cp310-cp310-linux_x86_64.whl`.
            Install the one matching your GPU's compute capability, e.g.:

                uv pip install <release-url>/mmcv-<ver>-0sm86-cp310-cp310-linux_x86_64.whl
