# cu128 dev/runtime environment for this mmcv fork.
#
# This is a uv *virtual* project (it does not build mmcv itself); `uv sync`
# provisions the cu128 stack so you can import mmcv and run the GPU smoke.
# The sm_120 wheel URL below is finalized after the cu128-wheels-v0.1 Release
# is published in the migration workdoc's step 8.
#
# To build mmcv FROM THIS SOURCE TREE for specific compute capabilities, use the
# justfile recipes (`just build-wheel CC=12.0`, `just build-all`) or the GitHub
# Action in .github/workflows/build-cu128-wheels.yml — those need nvcc.
[project]
name = "mmcv-cu128-devenv"
version = "0.0.0"
description = "cu128 (torch 2.8.0 + cu128) dev/runtime env for the mmcv fork"
requires-python = ">=3.10,<3.11"
dependencies = [
    "torch==2.8.0",
    "torchvision==0.23.0",
    "numpy<2",
    "mmengine>=0.10,<1.0",
    "mmcv==2.2.0",
]

[tool.uv]
package = false

[tool.uv.sources]
mmcv = { url = "https://github.com/yuki-inaho/mmcv/releases/download/cu128-wheels-v0.1/mmcv-2.2.0-0sm120t280-cp310-cp310-linux_x86_64.whl" }
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
