# cu12 dev/runtime environment for this mmcv fork.
#
# This is a uv *virtual* project (it does not build mmcv itself); `uv sync`
# provisions the validated cu12 stack so you can import mmcv and run the GPU
# smoke immediately. The prebuilt cu121 cp310 wheel is used for fast, reproducible
# setup (matching the mmopenlab_cu12_sandbox validation).
#
# To build mmcv FROM THIS SOURCE TREE for specific compute capabilities, use the
# justfile recipes (`just build-wheel CC=8.6`, `just build-all`) or the GitHub
# Action in .github/workflows/build-cu121-wheels.yml — those need nvcc.
[project]
name = "mmcv-cu12-devenv"
version = "0.0.0"
description = "cu12 (torch 2.1.0 + cu121) dev/runtime env for the mmcv fork"
requires-python = ">=3.10,<3.11"
dependencies = [
    "torch==2.1.0",
    "torchvision==0.16.0",
    "numpy<2",
    "mmengine>=0.10,<1.0",
    "mmcv==2.2.0",
]

[tool.uv]
package = false

[tool.uv.sources]
mmcv = { url = "https://download.openmmlab.com/mmcv/dist/cu121/torch2.1.0/mmcv-2.2.0-cp310-cp310-manylinux1_x86_64.whl" }
torch = { index = "pytorch-cu121" }
torchvision = { index = "pytorch-cu121" }

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true
